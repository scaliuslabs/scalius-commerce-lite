<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scalius variant section concepts</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-100 text-zinc-950 antialiased">
    <header class="sticky top-0 z-20 border-b border-zinc-200 bg-white/95 backdrop-blur">
      <div class="mx-auto flex max-w-[1600px] flex-col gap-3 px-4 py-3 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-sm font-semibold">Scalius · Variant section decision gate</p>
          <p class="mt-0.5 text-xs text-zinc-500">Same domain, three different interaction models. No production code is used here.</p>
        </div>
        <nav class="flex flex-wrap gap-1.5" aria-label="Prototype choices">
          <button data-file="01-table-first.html" class="concept rounded-md bg-zinc-950 px-3 py-1.5 text-xs font-medium text-white">01 Table first</button>
          <button data-file="02-option-builder.html" class="concept rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700">02 Option builder</button>
          <button data-file="03-progressive-workbench.html" class="concept rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700">03 Workbench</button>
          <a id="open-page" href="01-table-first.html" target="_blank" class="rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700">Open full page ↗</a>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-[1600px] p-3 sm:p-4">
      <iframe
        id="prototype"
        title="Variant section prototype"
        src="01-table-first.html"
        class="h-[calc(100vh-104px)] min-h-[720px] w-full rounded-xl border border-zinc-200 bg-white shadow-sm"
      ></iframe>
    </main>
    <script>
      const frame = document.querySelector('#prototype');
      const openPage = document.querySelector('#open-page');
      const buttons = Array.from(document.querySelectorAll('.concept'));
      for (const button of buttons) {
        button.addEventListener('click', () => {
          const file = button.dataset.file;
          frame.src = file;
          openPage.href = file;
          for (const candidate of buttons) {
            const selected = candidate === button;
            candidate.className = selected
              ? 'concept rounded-md bg-zinc-950 px-3 py-1.5 text-xs font-medium text-white'
              : 'concept rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700';
          }
        });
      }
    </script>
  </body>
</html>
