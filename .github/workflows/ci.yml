name: CI

on:
  pull_request:
    branches: [cloudflare-only, mono-repo, main]
  push:
    branches: [cloudflare-only, mono-repo, main]
  workflow_dispatch:
  # The whole private suite, sharded, and every rule's proof, PostgreSQL
  # included, once a week (and on demand above): a push runs only the tests
  # and rule proofs its change can reach, unless it reaches most of them
  # (the Test plan job), when it runs these too.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Test plan
    # Decides where a change's tests run. A push or pull request that selects more than a quarter
    # of the test files, or the proofs of more than a quarter of the enforced rules, is broad: one
    # runner cannot finish it in time, so it runs the sharded full suite and every rule's proof
    # (the weekly jobs below) instead of the affected tests and cited proofs in Quality Gates.
    # The schedule and a manual run are always broad.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.base }}
      broad: ${{ steps.decide.outputs.broad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.repository.private && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        with:
          fetch-depth: 0

      - name: Change base
        # A push is judged against the commit it replaced, a pull request against its base;
        # a rewritten history falls back to the parent commit.
        id: base
        if: ${{ github.event.repository.private && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base="$BEFORE"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base=HEAD~1
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ steps.base.outputs.base != '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.base.outputs.base != '' }}
        with:
          node-version: 24.21
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.base.outputs.base != '' }}
        run: pnpm install --frozen-lockfile

      - name: Decide
        id: decide
        env:
          BASE: ${{ steps.base.outputs.base }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" != "true" ]; then echo "broad=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BASE" ]; then echo "broad=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/test-affected.mjs --base "$BASE" --plan > "$RUNNER_TEMP/tests.json"
          # Quality Gates enforces the rule impact; here it only sizes the proofs (none if it cannot run).
          node rules/cli.mjs impact --base "$BASE" --json > "$RUNNER_TEMP/impact.json" 2>/dev/null || echo '{"run":[]}' > "$RUNNER_TEMP/impact.json"
          node rules/cli.mjs list --json > "$RUNNER_TEMP/rules.json"
          node -e '
            const read = (name) => require(`${process.env.RUNNER_TEMP}/${name}.json`);
            const tests = read("tests");
            const rules = read("rules");
            const enforced = (Array.isArray(rules) ? rules : rules.rules).filter((rule) => rule.status === "enforced").length;
            const proofs = read("impact").run.length;
            const broad = tests.broad || proofs > enforced * 0.25;
            console.log(`${tests.selected} of ${tests.total} test files, ${proofs} of ${enforced} enforced rules: ${broad ? "broad, sharded" : "affected only"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `broad=${broad}\n`);
          '

  quality-gates:
    name: Quality Gates
    needs: plan
    runs-on: ubuntu-latest
    # About 10 minutes for a normal push; a broad one leaves its tests and proofs to the sharded jobs.
    timeout-minutes: 60
    env:
      CHANGE_BASE: ${{ needs.plan.outputs.base }}
      BROAD: ${{ needs.plan.outputs.broad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21
          cache: pnpm

      - name: Repository hygiene
        run: node scripts/repository-hygiene.mjs

      - name: Whitespace guard
        run: git show --check --format= --no-renames HEAD

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      - name: Worker env binding guard
        run: pnpm check:env

      - name: Migration metadata guard
        run: pnpm --filter @scalius/database check:migrations

      - name: Generated file freshness
        # Every generator `pnpm regen` runs (the API contract and SDK, the plugin SDK contract and
        # ABI declarations, CLI recipes, bundled plugins, the dashboard route tree); a stale
        # generated file fails. The SDK step was already here; the rest add about 10 s.
        run: pnpm regen:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Rulebook check
        # The rulebook lives only in the private repository (rules/ is stripped from the export).
        # Against the change base it also holds the changed rules to their revisions and quality
        # bars, and fails a new unmapped production file in a harvested domain.
        if: ${{ github.event.repository.private }}
        run: |
          if [ -n "${CHANGE_BASE:-}" ]; then
            node rules/cli.mjs check --base "$CHANGE_BASE"
            node rules/cli.mjs coverage --enforce --base "$CHANGE_BASE"
          else
            node rules/cli.mjs check
            node rules/cli.mjs coverage --enforce
          fi

      - name: Rule impact
        # A change to a file a rule cites in `code` edits that rule in the same push, or a commit
        # says why it still holds (`Rule-Unchanged: <rule-id> <reason>`). The base commit's CLI
        # judges a change to the CLI itself, so a change cannot waive its own gate; a base CLI
        # that cannot run this check (exit 2) gives way to this commit's, with a warning.
        id: impact
        if: ${{ github.event.repository.private && env.CHANGE_BASE != '' }}
        run: |
          judge() {
            node rules/cli.mjs impact --base "$CHANGE_BASE" --enforce || return $?
            node rules/cli.mjs impact --base "$CHANGE_BASE" --json > "$RUNNER_TEMP/impact.json"
          }
          status=0
          if git diff --quiet "$CHANGE_BASE" HEAD -- rules/cli.mjs rules/rulebook.mjs; then
            judge || status=$?
          else
            git checkout "$CHANGE_BASE" -- rules/cli.mjs rules/rulebook.mjs
            judge || status=$?
            git checkout HEAD -- rules/cli.mjs rules/rulebook.mjs
            if [ "$status" -eq 2 ]; then
              echo "::warning::The base commit's rules/cli.mjs cannot judge this change; this commit's CLI does."
              status=0
              judge || status=$?
            fi
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "rules=$(node -p 'require(process.env.RUNNER_TEMP + "/impact.json").run.join(" ")')" >> "$GITHUB_OUTPUT"
          echo "postgres=$(node -p 'require(process.env.RUNNER_TEMP + "/impact.json").postgres')" >> "$GITHUB_OUTPUT"

      - name: PostgreSQL for the cited proofs
        # Started only when a proof to run needs it (about 20 s); PostgreSQL 15 is the oldest
        # supported major. A proof that needs it without this step fails as not run.
        if: ${{ steps.impact.outputs.postgres == 'true' && env.BROAD != 'true' }}
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:15
          for _ in $(seq 1 60); do docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          docker exec postgres pg_isready -U postgres -h 127.0.0.1
          echo "SCALIUS_TEST_POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"

      - name: Affected tests
        # The suite lives only in the private repository; the public export carries no tests.
        # A push tests what changed since its change base; a broad one runs the sharded suite instead.
        if: ${{ github.event.repository.private && env.CHANGE_BASE != '' && env.BROAD != 'true' }}
        run: pnpm test:affected --base "$CHANGE_BASE"

      - name: Cited rule proofs
        # The proofs of every rule the change can break, invariants and scenarios included,
        # under their own configs: a skip, a flake or a missing PostgreSQL run fails.
        # A broad change proves every rule in the Rulebook proof job instead.
        if: ${{ steps.impact.outputs.rules != '' && env.BROAD != 'true' }}
        # The cache proofs run the five-seed collecting DVC gate AGENTS.md requires; the
        # variables are inert for every other proof.
        env:
          RULES: ${{ steps.impact.outputs.rules }}
          DVC_SEEDS: "5"
          DVC_COLLECT: "1"
          # Seeds run in parallel shards (cores - 1) beside the other proofs on a 4-vCPU runner, so a
          # seed can take longer than the 420 s default; the extra time weakens no check.
          DVC_TIMEOUT_MS: "900000"
        run: node rules/cli.mjs test $RULES --strict --require postgres

      - name: Build
        run: pnpm build

      - name: API deploy dry-run
        # This job already ran the whole-repo typecheck above and runs the dist scan and the canary
        # builds below, so the dry run skips its own copies. A real deploy never skips them.
        run: pnpm run deploy:api -- --dry-run --skip-verified

      - name: Dist secret guard
        run: pnpm check:dist-secrets

      - name: Build canary guard
        run: pnpm check:build-canaries

      - name: Working tree cleanliness
        run: git diff --exit-code

  full-suite:
    name: Full test suite (${{ matrix.shard }}/4)
    # The private suite outgrows one runner; four shards finish it in parallel. Weekly, on demand,
    # and for a broad change (see Test plan).
    needs: plan
    if: ${{ github.event.repository.private && needs.plan.outputs.broad == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The PostgreSQL suites skip without a server; here they run (15, the oldest supported major).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCALIUS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:ci --shard=${{ matrix.shard }}/4

  rulebook-proof:
    name: Rulebook proof
    # Every rule's cited tests, the real-runtime invariants and the scenarios included, each
    # under its own config and on PostgreSQL too: the one place every rule is proven. A skip,
    # a test that passes only alone, or a PostgreSQL test that did not run fails it. Weekly, on
    # demand, and for a broad change (see Test plan).
    needs: plan
    if: ${{ github.event.repository.private && needs.plan.outputs.broad == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCALIUS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify every rule
        # Five seeds with collection: the DVC gate AGENTS.md requires, run weekly in full.
        env:
          DVC_SEEDS: "5"
          DVC_COLLECT: "1"
          # Same reason as the cited-proof step: five seeds share a 4-vCPU runner with --max-workers 3.
          DVC_TIMEOUT_MS: "900000"
        run: node rules/cli.mjs verify --strict --require postgres --max-workers 3
