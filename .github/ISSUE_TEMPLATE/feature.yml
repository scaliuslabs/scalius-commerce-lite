name: Product improvement
description: Suggest a capability or a better workflow.
labels:
  - "status: needs-triage"
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the user problem and the result you want. A short proposal is welcome; maintainers can research the implementation and ask follow-up questions.

        Never include secrets or private customer/order data.

  - type: textarea
    id: proposal
    attributes:
      label: What should improve?
      description: Describe who is affected, what is difficult today, and what a better outcome would look like.
      placeholder: When ..., users have to ...; it would be better if ...
    validations:
      required: true

  - type: dropdown
    id: primary-user
    attributes:
      label: Who would this help?
      options:
        - Not sure or several groups
        - Merchant or store owner
        - Employee or operator
        - Buyer or customer
        - Developer or platform operator
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Add screenshots, examples, workarounds, measurements, or links if they help explain the request.
      placeholder: Today we work around this by ...
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I have removed secrets and private customer/order data from this public proposal.
          required: true
