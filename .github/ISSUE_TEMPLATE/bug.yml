name: Bug report
description: Tell us about something that is not working as expected.
labels:
  - "status: needs-triage"
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A short, clear description is enough; maintainers can ask follow-up questions.

        Never include passwords, API keys, OTPs, receipt links or proofs, session tokens, or private customer/order data. Use GitHub's private vulnerability report for security issues.

  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Tell us what went wrong, what you expected, and how to reproduce it if you know how.
      placeholder: I tried to ...; instead ...
    validations:
      required: true

  - type: dropdown
    id: affected-workflow
    attributes:
      label: Where did this happen?
      options:
        - Not sure
        - Checkout or payments
        - Orders or fulfillment
        - Catalog, inventory, or media
        - Customers or sign-in
        - Promotions
        - Content or discovery
        - Settings or setup
        - Storefront
        - Admin
        - API, data, or operations
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Device or environment (optional)
      description: Browser, device, deployment, or version—only when it may help reproduce the problem.
      placeholder: Chrome on Android; production storefront; commit SHA
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional)
      description: Add sanitized evidence if useful. Remove all secrets and private customer/order data first.
      placeholder: Drag sanitized files here or paste a short log excerpt.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I have removed secrets and private customer/order data from this public report.
          required: true
