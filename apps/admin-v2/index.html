<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The API Worker fills in the runtime dashboard base path and prefixes
         every root-relative src/href below (apps/api/src/dashboard/surface.ts). -->
    <meta name="scalius-dashboard-base-path" content="">
    <meta name="robots" content="noindex,nofollow" />
    <title>Scalius Admin</title>
    <link rel="icon" href="/favicon.png" />
    <!-- Theme and language before first paint: the saved choice, else the system theme. -->
    <script>(function(){var d=document.documentElement,t=null,l=null;try{t=localStorage.getItem("theme");l=localStorage.getItem("scalius.dashboard.locale")}catch(e){}d.classList.toggle("dark",t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches);if(l==="bn")d.lang="bn"})()</script>
    <!-- Every page's first guard reads the session: start that read now, while
         the app downloads, instead of after it (src/lib/auth-guards.ts). -->
    <script>(function(){var b=document.querySelector('meta[name="scalius-dashboard-base-path"]').content;if(location.pathname.indexOf(b+"/scanner")===0)return;window.__scaliusSession=fetch(b+"/api/auth/dashboard-session",{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});window.__scaliusSession.catch(function(){})})()</script>
    <!-- Until the stylesheet arrives: the page colour (--background in both
         themes) and, when the first load takes over a second, a quiet spinner. -->
    <style>
      html{background:#f1f1f1}html.dark{background:#1a1a1a}
      #boot{position:fixed;inset:0;display:grid;place-items:center;animation:boot-in 0s 1s both}
      #boot::after{content:"";width:20px;height:20px;border:2px solid #8a8a8a;border-top-color:transparent;border-radius:50%;animation:boot-spin .8s linear infinite}
      @keyframes boot-in{from{visibility:hidden}}@keyframes boot-spin{to{transform:rotate(360deg)}}
      #boot p{grid-row:2;margin:12px 0 0;font:14px/20px system-ui,sans-serif;color:#616161}html.dark #boot p{color:#b5b5b5}
      #boot button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!-- Nothing protected renders until the session is known: only the boot
         spinner shows until the first route (and its guard) has resolved. -->
    <div id="root"><div id="boot" role="status" aria-label="Loading"></div></div>
    <!-- A load that has not mounted the app after 12 s offers a reload (PERF-02). -->
    <script>setTimeout(function(){var b=document.getElementById("boot");if(!b)return;var n=document.documentElement.lang==="bn",p=document.createElement("p"),r=document.createElement("button");p.textContent=n?"এখনো লোড হচ্ছে… ":"Still loading… ";r.type="button";r.textContent=n?"আবার লোড করুন":"Reload";r.onclick=function(){location.reload()};p.append(r);b.removeAttribute("aria-label");b.append(p)},12000)</script>
    <noscript>The Scalius dashboard needs JavaScript.</noscript>
  </body>
</html>
