packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

peerDependencyRules:
  allowedVersions:
    react: "19"
    date-fns: "3 || 4"
    eslint: "10"
    tailwindcss: "4"
    typescript: "5 || 6"

# apps/storefront pins astro exactly at 7.4.8 (not a caret). The storefront's
# Content-Security-Policy hashes Astro's island and `client:load` scripts from
# the files apps/storefront/src/lib/inline-script-policy.ts imports under
# astro/runtime/. Astro 7.4.9 moved them into its own exact dependency,
# @astrojs/runtime. Moving past 7.4.8 means pointing those three imports at
# @astrojs/runtime and adding a test that the copy the storefront imports is
# the same resolved file Astro itself emits from; otherwise the policy can hash
# different bytes than the page carries and block the scripts with every test
# green.

overrides:
  # React 19.3.0 adds 7 KiB Brotli to the dashboard entry chunk and breaks the
  # admin-perf budgets for no feature we use; hold 19.2.8 until a budgeted upgrade.
  react: "19.2.8"
  react-dom: "19.2.8"
  # One esbuild: Wrangler pins 0.28.2; drizzle-kit (^0.25) and tsx (~0.28) take it too.
  esbuild: "0.28.2"
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0, below the 4.3.2 fix.
  js-yaml: "4.3.2"
  # Stable Wrangler pins an exact Miniflare beta and workerd build. Move these
  # three, the root miniflare and every @cloudflare/workers-types floor together.
  wrangler: "4.161.0"
  # Astro's dev runtime must support the same compatibility date as Wrangler.
  "@cloudflare/vite-plugin>miniflare": "5.20261110.2-beta"
  "@cloudflare/vite-plugin>workerd": "1.20261110.1"
  # TanStack Router's serializer: 1.6.11+ escapes RegExp sources and typed-array
  # constructors. Its plugins ship in lockstep and take it as a peer.
  seroval: "1.6.12"
  seroval-plugins: "1.6.12"
  # The API pins Hono exactly; its OpenAPI, validator and MCP dependents share that copy.
  hono: "4.13.18"
  # The dashboard's Radix primitives stay on one release line; a newer dialog
  # under cmdk alone duplicates the shared primitives in every route bundle.
  "cmdk>@radix-ui/react-dialog": "1.1.23"
  # One Slot implementation for direct and transitive Radix primitives. 1.4
  # preserves each wrapper's aria-describedby instead of dropping help text.
  "@radix-ui/react-slot": "1.4.0"
  # Typography pins v6; v7 makes AST insertions during iteration safe.
  # Its generated prose CSS must stay equivalent when this override changes.
  "@tailwindcss/typography@0.5.20>postcss-selector-parser": "7.1.6"

auditConfig:
  ignoreGhsas:
    # minimatch below 11.0.1 (GHSA-g3hv-75wg-m249) runs only in the lint stack
    # (eslint, its config array, typescript-estree, eslint-plugin-jsx-a11y), on globs
    # from this repo's own config. jsx-a11y (latest, minimatch ^3) calls the default
    # export that 9+ dropped, and no 3.x or 10.x fix exists. This ignore covers the
    # whole tree: re-check by 2026-12-31, and drop it the day `pnpm why minimatch -P`
    # shows a runtime dependent or jsx-a11y moves past minimatch 3.
    - GHSA-g3hv-75wg-m249

allowBuilds:
  '@firebase/util': true
  '@mongodb-js/zstd': false
  core-js: false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  workerd: true

patchedDependencies:
  # Upstream 1.2.3 still accepts the previous refresh token (cloudflare/workers-oauth-provider#43).
  # Fail closed with strict single-use rotation until the provider ships an equivalent fix.
  '@cloudflare/workers-oauth-provider@1.2.3': patches/@cloudflare__workers-oauth-provider@1.2.3.patch

# pnpm adds a release younger than the one-day minimumReleaseAge here when it
# resolves one. Better Auth 1.7.22 (2026-11-12) carries Workers fixes; delete
# these entries once they are older than a day.
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - better-auth@1.7.22
  - miniflare@5.20261110.2-beta
  - wrangler@4.161.0
