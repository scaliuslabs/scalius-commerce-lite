packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
  - protobufjs
  - "@firebase/util"

peerDependencyRules:
  allowedVersions:
    react: "19"
    date-fns: "3 || 4"
    eslint: "10"
    tailwindcss: "4"
    typescript: "5 || 6"
  ignoreMissing:
    - react-is

overrides:
  react: "^19.2.8"
  react-dom: "^19.2.8"
  react-is: "^19.2.8"
  picomatch: ">=2.3.2"
  yaml: ">=2.8.3"
  dompurify: ">=3.4.13"
  postcss: ">=8.5.23"
  jws: "^3.2.3"
  esbuild: "0.28.1"
  mdast-util-to-hast: "^13.2.1"
  markdown-it: ">=14.1.1"
  devalue: "5.9.4"
  h3: ">=1.15.9"
  diff: ">=5.2.2"
  lodash: ">=4.17.23"
  undici: "8.11.2"
  fast-uri: "3.1.8"
  svgo: "4.1.0"
  wrangler: "4.148.0"
  partyserver: "0.5.9"
  better-call: "1.4.0"
  shell-quote: "1.8.4"
  "@grpc/grpc-js": "1.14.4"
  ws: "8.21.0"
  qs: "6.16.0"
  js-yaml: "4.3.2"
  brace-expansion: "5.0.12"
  "nanoid@<3.3.17": "3.3.17"
  hono: "4.13.13"
  # One zod for the whole graph (Better Auth's types are re-exported by core).
  # 4.6 leaves `_zod.bag` empty, which the dashboard's schema-form introspection
  # reads (apps/admin-v2/.../schema-form/introspect.ts); move both together.
  zod: "4.5.4"
  # The dashboard's Radix primitives stay on one release line; a newer dialog
  # under cmdk alone duplicates the shared primitives in every route bundle.
  "cmdk>@radix-ui/react-dialog": "1.1.23"
  prosemirror-model: "1.25.11"
  sharp: "0.35.5"
  source-map-js: "1.2.2"
  "postcss-selector-parser@^7": "7.1.6"
  # Typography pins v6; v7 makes AST insertions during iteration safe.
  # Its generated prose CSS must stay equivalent when this override changes.
  "@tailwindcss/typography@0.5.20>postcss-selector-parser": "7.1.6"
  # Routine refresh, not a confirmed security patch: the maintainer disputes
  # GHSA-ch52-4w7c-c8xp (upstream issue 56). Used only by Astro's image build cache.
  http-cache-semantics: "4.3.0"
  # The agents server declaration chunk imports ClientOptions, even without
  # client runtime use. Keep that type dependency patched; server stays on v2.0.
  "agents@0.22.0>@modelcontextprotocol/client": "2.2.0"
  # We use only agents/mcp/server, whose runtime and types never import SDK v1.
  # Reassess this unused peer removal before an agents upgrade or legacy entry use.
  "agents@0.22.0>@modelcontextprotocol/sdk": "-"

allowBuilds:
  '@firebase/util': true
  '@mongodb-js/zstd': false
  core-js: false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1 || 0.4.3'
  - '@astrojs/react@6.0.1'
  - astro@7.1.3 || 7.3.6
  - '@astrojs/cloudflare@14.1.4 || 14.3.4'
  - '@vitejs/plugin-react@6.0.3 || 6.0.5'
  - vite@8.1.5 || 8.2.0 || 8.3.3
  - '@cloudflare/workers-types@5.20260719.1 || 5.20260721.1 || 5.20260722.1 || 5.20260730.1 || 5.20261006.1'
  - '@cloudflare/workerd-darwin-64@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1'
  - '@cloudflare/workerd-linux-64@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1'
  - '@cloudflare/workerd-linux-arm64@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1'
  - '@cloudflare/workerd-windows-64@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1'
  - miniflare@4.20260714.0 || 4.20260721.0 || 4.20260730.0 || 5.20260831.0-alpha || 5.20261006.0-alpha
  - workerd@1.20260714.1 || 1.20260721.1 || 1.20260730.1 || 1.20261006.1
  - wrangler@4.112.0 || 4.113.0 || 4.116.0 || 4.128.0 || 4.148.0
  - '@tanstack/query-core@5.101.3'
  - '@tanstack/react-query@5.101.3'
  - '@cloudflare/vite-plugin@1.46.0 || 1.49.0'
  - react-dom@19.2.8
  - react@19.2.8
  - react-is@19.2.8
  - '@tanstack/react-start-rsc@0.1.32'
  - '@tanstack/react-start@1.168.33'
  - '@astrojs/internal-helpers@0.12.0'
  - '@tursodatabase/serverless@1.4.1'
  - nanostores@1.5.5

patchedDependencies:
  # Upstream 0.10.3 accepts a previous refresh token repeatedly (cloudflare/workers-oauth-provider#43).
  # Fail closed with strict single-use rotation until the provider ships an equivalent fix.
  '@cloudflare/workers-oauth-provider@0.10.3': patches/@cloudflare__workers-oauth-provider@0.10.3.patch
